name: Publish Hualiusir website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Copy the existing public developer website
        env:
          SOURCE_ORIGIN: https://hold-until-dawn-game.r8j4crcxsq.chatgpt.site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          for file in index.html privacy.html delete-data.html app-ads.txt robots.txt assets/icon.png assets/defense.png; do
            curl --fail --silent --show-error --location --retry 3 --max-time 60 --user-agent "HualiusirSitePublisher/1.0" "$SOURCE_ORIGIN/$file" --output "_site/$file"
          done
          # BIGO assigns a seller ID for each website domain.
          printf '\nbigo.sg, adbbxsny1t, DIRECT\n' >> _site/app-ads.txt
          touch _site/.nojekyll
      - name: Merge and verify website advertising authorization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path("_site")
          for name in ["index.html", "privacy.html", "delete-data.html", "app-ads.txt", "robots.txt", "assets/icon.png", "assets/defense.png"]:
              assert (site / name).stat().st_size > 0, name
          ads_path = site / "app-ads.txt"
          lines = ads_path.read_text(encoding="utf-8-sig").splitlines()
          normalize = lambda line: "".join(line.split())
          sellers = {normalize(line) for line in lines}
          unity_lines = [line.strip() for line in Path(".site-data/unity-app-ads.txt").read_text(encoding="utf-8-sig").splitlines() if line.strip()]
          assert len(unity_lines) == 163, "Unity seller list must contain all dashboard entries"
          canonical_unity = {normalize(line): line for line in unity_lines}
          lines = [canonical_unity.get(normalize(line), line) for line in lines]
          for line in unity_lines:
              if normalize(line) not in sellers:
                  lines.append(line)
                  sellers.add(normalize(line))
          yandex_lines = [line.strip() for line in Path(".site-data/yandex-app-ads.txt").read_text(encoding="utf-8-sig").splitlines() if line.strip()]
          assert len(yandex_lines) == 170, "Yandex seller list must contain all dashboard entries"
          for line in yandex_lines:
              if line not in lines:
                  lines.append(line)
                  sellers.add(normalize(line))
          assert all(line in lines for line in yandex_lines)
          assert "yandex.com,334469093,DIRECT" in sellers
          assert "yango-ads.com,334469093,DIRECT" in sellers
          ads_path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          assert all(line in lines for line in unity_lines)
          assert "unity.com,162167400,DIRECT,96cabb5fbdde37a7" in sellers
          assert "bigo.sg,adbbxsny1t,DIRECT" in sellers
          assert "google.com,pub-4447056814927396,DIRECT,f08c47fec0942fa0" in sellers
          assert "inmobi.com,67d6afab48bd48efbbb504284f3726e5,DIRECT,83e75a7ae333ca9d" in sellers
          assert "vungle.com,6af12a3093f426c33e7af61e,DIRECT,c107d686becd2d77" in sellers
          assert "com.simon0090.holduntildawn" in (site / "index.html").read_text(encoding="utf-8")
          print("Public website and all six advertising platform authorizations verified.")
          PY
      - name: Upload public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
